plugins { id 'com.android.application' }
android {
    namespace 'com.magictupper.remote'
    compileSdk 35
    defaultConfig {
        applicationId 'com.magictupper.remote'
        minSdk 26
        targetSdk 35
        versionCode 11000
        versionName '1.1.0'
        externalNativeBuild { cmake { cppFlags '-std=c++17' } }
    }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt' } }
}
